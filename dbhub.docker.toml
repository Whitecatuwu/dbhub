# DBHub configuration used inside the container (compose-dbhub.yaml mounts this
# file as /app/dbhub.toml). It mirrors dbhub.toml, which is used when DBHub runs
# directly on the host (npx / stdio).
#
# Differences from dbhub.toml:
#   - host is host.docker.internal: inside the container "127.0.0.1" is the
#     container itself, not the Windows host where MySQL's port 3307 is published.
#     compose-dbhub.yaml maps host.docker.internal to the host gateway.
#
# DBHUB_MYSQL_PASSWORD is read from /app/.env (the .env mounted by compose).

[[sources]]
id = "docker_mysql"
description = "Docker MySQL product database"
type = "mysql"
host = "host.docker.internal"
port = 3307
database = "test"
user = "root"
password = "${DBHUB_MYSQL_PASSWORD}"

[[tools]]
name = "search_objects"
source = "docker_mysql"

[[tools]]
name = "execute_sql"
source = "docker_mysql"
readonly = true
max_rows = 1000
