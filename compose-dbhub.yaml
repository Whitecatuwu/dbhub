services:
  dbhub:
    build:
      context: .
      dockerfile: Dockerfile.dbhub
    image: dbhub-local:1.5.0
    init: true
    restart: unless-stopped
    # Secrets and optional settings (DBHUB_MYSQL_PASSWORD, DBHUB_AUTH_TOKEN,
    # DBHUB_ALLOWED_HOSTS) come from the mounted .env below; do not put READONLY
    # or MAX_ROWS there (unsupported, DBHub exits). The database source is defined
    # in dbhub.docker.toml (use host.docker.internal for databases on the host).
    environment:
      NODE_ENV: production
      TRANSPORT: http
      PORT: "8080"
      DBHUB_HOST: 0.0.0.0
    command: ["--transport=http", "--config=/app/dbhub.toml"]
    ports:
      - "127.0.0.1:${DBHUB_DOCKER_PORT:-18080}:8080"
    volumes:
      - type: bind
        source: ./.env
        target: /app/.env
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./dbhub.docker.toml
        target: /app/dbhub.toml
        read_only: true
        bind:
          create_host_path: false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
